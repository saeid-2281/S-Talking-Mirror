[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="s-talking"
version="0.3.0"
description="Professional AI Audio Studio"
readme="README.md"
requires-python=">=3.11"
dependencies=["httpx>=0.27,<1","pydantic>=2.7,<3","loguru>=0.7,<1","PySide6>=6.7,<7"]
[project.optional-dependencies]
piper=["piper-tts>=1.3"]
dev=["pytest>=8,<9","ruff>=0.5,<1"]
[project.scripts]
stalking="app.cli:main"
stalking-gui="app.gui.main:main"
[tool.setuptools.packages.find]
include=["app*"]
