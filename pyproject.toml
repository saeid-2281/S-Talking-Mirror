[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="s-talking"
version = "1.0.0"
description="Professional AI Audio Studio"
readme="README.md"
requires-python=">=3.11"
dependencies=["httpx>=0.27,<1","pydantic>=2.7,<3","loguru>=0.7,<1","PySide6>=6.7,<7","openpyxl>=3.1,<4"]
[project.optional-dependencies]
piper=["piper-tts>=1.4.2,<2"]
openai=["openai>=1.0,<3"]
azure=["azure-cognitiveservices-speech>=1.40,<2"]
google=["google-cloud-texttospeech>=2.29,<3"]
aws=["boto3>=1.34,<2"]
kokoro=["kokoro>=0.9"]
excel=["openpyxl>=3.1,<4"]
documents=["pypdf>=5,<7"]
all-providers=["openai>=1.0,<3","azure-cognitiveservices-speech>=1.40,<2","google-cloud-texttospeech>=2.29,<3","boto3>=1.34,<2","kokoro>=0.9","piper-tts>=1.4.2,<2"]
dev=["pytest>=8,<9","ruff>=0.5,<1"]
[project.scripts]
stalking="app.cli:main"
stalking-gui="app.gui.main:main"
[tool.setuptools.packages.find]
include=["app*"]
[tool.ruff.lint.per-file-ignores]
"app/database/legacy.py"=["E702"]
"app/gui/main.py"=["E401","E701","E702","F403","F405"]
"app/gui/worker.py"=["E401","E701","E702"]
"app/project.py"=["E701","E702"]
"app/provider_factory.py"=["E701","E702"]
"app/providers/mock.py"=["E401","E701","E702"]
"app/providers/piper.py"=["E401","E701","E702"]
"app/state.py"=["F401"]
